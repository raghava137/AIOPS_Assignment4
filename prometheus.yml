global:
  scrape_interval: 2s
  evaluation_interval: 2s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

rule_files:
  - "rules.yml"

scrape_configs:
  # my streamlit app
  - job_name: "caption_app"
    static_configs:
      - targets: ["localhost:18000"]

  # node_exporter (cpu, ram, disk, network of my laptop)
  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
